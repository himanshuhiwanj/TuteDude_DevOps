version : '3.6'
services :
    backend :
      build : backend
      volumes : 
        - ./backend:/app
      hostname : backend-host
      ports : 
        - "8000:5000"
      networks: 
        - ares-network
    
    frontend :
      build : frontend
      volumes : 
        - ./frontend:/app
      environment: 
        - BACKEND_URL=http://backend-host:8000/api
      ports : 
        - "3000:3000"
      links: 
        - backend
      depends_on : 
        - backend
      networks : 
        - ares-network
networks:
  ares-network:
    driver: bridge
  